# --- Local MySQL profile (fast iteration during development) ---
# Requires a local MySQL 8.x instance with a database created, e.g.:
#   CREATE DATABASE eventsphere;

spring.datasource.url=jdbc:mysql://localhost:3306/eventsphere?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:mysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Safe to auto-update schema locally while entities are still evolving.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Verbose logging locally ? never enabled on the aiven/prod profile.
logging.level.lk.ijse.eventsphere=DEBUG
logging.level.org.hibernate.SQL=DEBUG
