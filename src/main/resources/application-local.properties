# --- Local MySQL Profile ---
# Database connection coordinates supplied via environment variables (.env)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Safe to auto-update schema locally while entities are still evolving.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Verbose logging locally
logging.level.lk.ijse.eventsphere=DEBUG
logging.level.org.hibernate.SQL=DEBUG
