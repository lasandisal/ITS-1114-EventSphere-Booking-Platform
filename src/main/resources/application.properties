spring.application.name=eventsphere

# Active profile
spring.profiles.active=aiven

# Common JPA settings
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS Settings 
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://localhost:3000,http://127.0.0.1:5500,https://lasandisal.github.io}

# JWT (Cleaned duplicate key and set safe default fallback)
app.jwt.secret=${JWT_SECRET:LocalSuperSecretKeyForJWTThatIsAtLeast32BytesLong123456!}
app.jwt.expiration-ms=86400000

# Booking checkout hold TTL
booking.hold-ttl-minutes=10

# Mail (JavaMailSender)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Gemini API Settings
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=gemini-2.5-flash-lite

# PayHere IPG
app.payhere.merchant-id=${PAYHERE_MERCHANT_ID:}
app.payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET:}
app.payhere.currency=LKR
app.payhere.return-url=${PAYHERE_RETURN_URL:https://lasandisal.github.io/EventSphere-App/pages/my-bookings.html}
app.payhere.cancel-url=${PAYHERE_CANCEL_URL:https://lasandisal.github.io/EventSphere-App/pages/my-bookings.html}
app.payhere.notify-url=https://its-1114-eventsphere-booking-platform.onrender.com/api/v1/payments/notify

# Secret for signing QR ticket payloads
app.ticket.qr-secret=${TICKET_QR_SECRET:DefaultSuperSecretKeyForSigningEventSphereTickets2026!}

# Seeded default admin account
app.admin.email=${ADMIN_EMAIL:admin@eventsphere.lk}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123}

# --- Aiven Managed MySQL Profile ---
spring.datasource.url=${DB_URL:jdbc:mysql://eventsphere-mysql-lasandisalwathura-136b.c.aivencloud.com:15664/defaultdb?createDatabaseIfNotExist=true&sslMode=REQUIRED&enabledTLSProtocols=TLSv1.2,TLSv1.3}
spring.datasource.username=${DB_USERNAME:avnadmin}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- HikariCP Connection Pool (Optimized for Render Free Tier) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

# --- JPA & Hibernate Startup Optimizations ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# 1. Disable explicit dialect to avoid slow metadata inspection
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect (REMOVED)

# 2. Disable JDBC metadata extraction to cut down ~20-30s off startup
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Production / Cloud Logging
logging.level.lk.ijse.eventsphere=INFO
logging.level.org.hibernate.SQL=WARN