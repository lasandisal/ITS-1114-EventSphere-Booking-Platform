spring.application.name=eventsphere

server.port=${PORT}

# Embedded Tomcat thread & connection limits (conserves RAM on Render Free Tier)
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=100

# Active profile
spring.profiles.active=local

# Common JPA settings
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# CORS Settings
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# JWT Authentication
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Booking checkout hold TTL
booking.hold-ttl-minutes=10

# Mail (JavaMailSender)
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
app.mail.sender-email=${MAIL_SENDER_EMAIL:eventsphere.tickets@gmail.com}

# Gemini API Settings
app.gemini.api-key=${GEMINI_API_KEY}
app.gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
app.gemini.base-url=${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

# PayHere IPG Configuration
app.payhere.mode=${PAYHERE_MODE:sandbox}
app.payhere.merchant-id=${PAYHERE_MERCHANT_ID}
app.payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET}
app.payhere.currency=${PAYHERE_CURRENCY:LKR}
app.payhere.return-url=${PAYHERE_RETURN_URL}
app.payhere.cancel-url=${PAYHERE_CANCEL_URL}
app.payhere.notify-url=${PAYHERE_NOTIFY_URL}
app.payhere.sandbox-url=${PAYHERE_SANDBOX_URL:https://sandbox.payhere.lk/pay/checkout}
app.payhere.live-url=${PAYHERE_LIVE_URL:https://www.payhere.lk/pay/checkout}


# Secret for signing QR ticket payloads
app.ticket.qr-secret=${TICKET_QR_SECRET}

# Seeded default admin account
app.admin.email=${ADMIN_EMAIL:eventsphere.tickets@gmail.com}
app.admin.password=${ADMIN_PASSWORD}

# --- Database Driver & HikariCP Connection Pool ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.connection-timeout=20000

# --- JPA & Hibernate Settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false