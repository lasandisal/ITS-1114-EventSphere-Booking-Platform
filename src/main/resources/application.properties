spring.application.name=eventsphere

# Which profile runs by default when no --spring.profiles.active flag is passed.
# Override at launch: java -jar app.jar --spring.profiles.active=aiven
spring.profiles.active=aiven

# Common JPA settings ? actual connection details live in the per-profile files.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# JWT ? secret is pulled from env, never hardcoded (see application-local/aiven).
app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=86400000

# Booking checkout hold TTL, referenced by BookingService + the expiry scheduler.
booking.hold-ttl-minutes=10

# Mail (JavaMailSender) ? credentials from env, provider left generic so you can
# swap Gmail SMTP for a transactional provider later without touching code.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=mishtixcreations@gmail.com
spring.mail.password=zolh ksym pvsx vwfg
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Claude API ? called server-side only, key never reaches the frontend.
app.claude.api-key=${CLAUDE_API_KEY:}
app.claude.model=claude-sonnet-4-6

# PayHere IPG ? sandbox by default. Get merchant-id/secret from the PayHere
# sandbox dashboard (https://sandbox.payhere.lk) while developing; swap to
# live credentials only on the production/graded deployment.
app.payhere.merchant-id=${PAYHERE_MERCHANT_ID:}
app.payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET:}
app.payhere.currency=LKR
app.payhere.return-url=${PAYHERE_RETURN_URL:http://localhost:5500/payment-success.html}
app.payhere.cancel-url=${PAYHERE_CANCEL_URL:http://localhost:5500/payment-cancelled.html}
# notify-url MUST be a publicly reachable HTTPS URL ? localhost will never
# receive PayHere's webhook. Use a tunnel (ngrok/localtunnel) while testing
# locally and point this at the tunnel URL; Aiven-hosted deploys need their
# real public URL here instead.
app.payhere.notify-url=https://its-1114-eventsphere-booking-platform.onrender.com/api/v1/payments/notify

# Secret for signing QR ticket payloads (HMAC-SHA256) ? generate with
# `openssl rand -base64 48`, distinct from app.jwt.secret.
app.ticket.qr-secret=${TICKET_QR_SECRET:DefaultSuperSecretKeyForSigningEventSphereTickets2026!}

# Seeded default admin account ? see DataSeeder.
app.admin.email=${ADMIN_EMAIL:admin@eventsphere.lk}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123}
