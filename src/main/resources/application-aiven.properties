# --- Aiven managed MySQL profile (graded/deployed run) ---
# All secrets come from environment variables ? nothing sensitive is committed.
# Set before running:
#   DB_USERNAME, DB_PASSWORD  -> from Aiven's "Quick connect" panel
#   JWT_SECRET                -> long random string, e.g. `openssl rand -base64 48`
#   MAIL_USERNAME, MAIL_PASSWORD, CLAUDE_API_KEY

spring.datasource.url=jdbc:mysql://mysql-25b7ad7d-lasandisalwathura-136b.i.aivencloud.com:15664/defaultdb?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Never let Hibernate auto-alter a shared/graded database. Schema is created
# via migration (or a one-time manual run of ddl-auto=update), then locked
# to validate so accidental entity changes fail loudly instead of silently
# mutating the live schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.lk.ijse.eventsphere=INFO
logging.level.org.hibernate.SQL=WARN
